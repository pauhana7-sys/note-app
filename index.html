<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナツヤ狙い目サイト｜AI要約（MVP）</title>
<style>
  :root{ --bg:#0f1216; --card:#171b21; --line:#2a2f37; --ink:#f2f4f7; --sub:#a7adb7; --accent:#0ca30c; --accent2:#2a78d6; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  h1{ font-size:22px; margin:0 0 4px; }
  p.sub{ color:var(--sub); font-size:14px; margin:0 0 22px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
  .label{ font-weight:700; font-size:14px; margin-bottom:10px; }
  .drop{ border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--sub);
    cursor:pointer; transition:.15s; }
  .drop:hover{ border-color:var(--accent2); color:var(--ink); }
  .drop.hasimg{ padding:12px; }
  #preview{ max-width:100%; max-height:340px; border-radius:8px; display:none; }
  select, button{ font:inherit; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  select{ background:#0f1216; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  button{ background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 20px; font-weight:700; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:default; }
  #out{ white-space:pre-wrap; line-height:1.7; font-size:15px; }
  #out.empty{ color:var(--sub); }
  .spin{ display:inline-block; width:15px; height:15px; border:2px solid #fff; border-top-color:transparent;
    border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes s{ to{ transform:rotate(360deg); } }
  .foot{ color:var(--sub); font-size:12px; margin-top:8px; }
  .tag{ display:inline-block; background:#0ca30c22; color:#5fd35f; border:1px solid #0ca30c55; border-radius:999px;
    padding:2px 9px; font-size:11px; font-weight:700; margin-left:8px; vertical-align:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ナツヤ狙い目サイト <span class="tag">MVP</span></h1>
  <p class="sub">攻略スクショをアップすると、AIが狙い目・数値・示唆の要点を抜き出して要約します。</p>

  <div class="card">
    <div class="label">① 攻略スクショを選ぶ</div>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <span id="dropText">ここをクリックして画像を選択（すろらぼ / genpachi 等のスクショ）</span>
      <img id="preview" alt="preview">
    </label>
    <div class="row">
      <select id="kind">
        <option value="狙い目・期待値の表">狙い目・期待値の表</option>
        <option value="解析・スペック">解析・スペック</option>
        <option value="示唆・演出">示唆・演出</option>
        <option value="その他">その他</option>
      </select>
      <button id="go" disabled>AIで要約する</button>
    </div>
    <div class="foot" id="hint"></div>
  </div>

  <div class="card">
    <div class="label">② AIの要約</div>
    <div id="out" class="empty">まだ要約はありません。画像を選んで「AIで要約する」を押してください。</div>
  </div>
</div>

<script>
const fileEl = document.getElementById('file');
const drop = document.getElementById('drop');
const dropText = document.getElementById('dropText');
const preview = document.getElementById('preview');
const go = document.getElementById('go');
const out = document.getElementById('out');
const hint = document.getElementById('hint');
const kind = document.getElementById('kind');
let dataUrl = null;

drop.addEventListener('click', ()=> fileEl.click());
fileEl.addEventListener('change', ()=>{
  const f = fileEl.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    dataUrl = r.result;
    preview.src = dataUrl; preview.style.display='block';
    dropText.style.display='none'; drop.classList.add('hasimg');
    go.disabled = false;
    hint.textContent = f.name + '（' + Math.round(f.size/1024) + ' KB）';
  };
  r.readAsDataURL(f);
});

go.addEventListener('click', async ()=>{
  if(!dataUrl) return;
  const m = dataUrl.match(/^data:(.*?);base64,(.*)$/);
  if(!m){ out.textContent='画像の読み込みに失敗しました。'; return; }
  go.disabled = true;
  out.classList.remove('empty');
  out.innerHTML = '<span class="spin"></span>要約中…';
  try{
    const res = await fetch('/api/summarize', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ media_type:m[1], image:m[2], kind:kind.value })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || ('HTTP '+res.status)); }
    out.textContent = data.summary || '(空の応答)';
  }catch(e){
    out.textContent = '⚠️ エラー: ' + e.message;
  }finally{
    go.disabled = false;
  }
});
</script>
</body>
</html>
